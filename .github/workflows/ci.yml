name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Build, Lint, Typecheck, Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Nur Entwicklungswerte aus .env.example – CI braucht keine echten Zugangsdaten.
      - run: cp .env.example .env
      # Supabase Auth (auth + gateway) brauchen die Tests zu Kontolöschung und erneuter Anmeldung
      - name: Datenbank, Suche, Redis, Mailpit und Supabase Auth starten
        run: |
          docker compose -f infra/docker-compose.yml --env-file .env up -d --wait db meilisearch redis mailpit auth gateway
          for i in $(seq 1 30); do curl -sf http://localhost:54321/auth/v1/health && exit 0; sleep 2; done
          docker compose -f infra/docker-compose.yml --env-file .env logs auth gateway
          exit 1
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: API-Integrationstests
        run: pnpm --filter @marktat/api test:e2e
      # Schema und Migrationen müssen übereinstimmen (leere Hilfsdatenbank marktat_shadow aus dem Init-Skript)
      - name: Migrationen prüfen
        run: pnpm --filter @marktat/api db:check-migrations
      # Sicherung und Wiederherstellung mit synthetischen Daten in eigenen, temporären Datenbanken
      - name: Sicherung und Wiederherstellung prüfen
        run: pnpm --filter @marktat/api db:backup-check

  images:
    name: Docker-Images für den Online-Betrieb
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # Nur bauen (kein Upload). Platzhalter-Adressen; echte Images baut .github/workflows/deploy.yml
      - run: docker build -f apps/api/Dockerfile -t marktat-api:ci .
      - run: |
          docker build -f apps/web/Dockerfile -t marktat-web:ci \
            --build-arg WEB_URL=https://marktat.example --build-arg API_URL=https://api.marktat.example \
            --build-arg SUPABASE_URL=https://api.marktat.example --build-arg SUPABASE_ANON_KEY=ci-placeholder .
      # Die Produktionskonfiguration ist gültig und die Verwaltungsbefehle laufen ohne Internet (pnpm, Prisma)
      - name: Compose-Datei und Image prüfen
        run: |
          cp infra/production/env.production.example infra/production/.env
          node infra/production/generate-secrets.mjs infra/production/.env
          printf '%s\n' WEB_DOMAIN=marktat.example API_DOMAIN=api.marktat.example ACME_EMAIL=ci@marktat.example \
            SMTP_HOST=smtp.example MAIL_FROM_ADDRESS=noreply@marktat.example >> infra/production/.env
          IMAGE_TAG=ci docker compose -f infra/production/compose.yml --env-file infra/production/.env \
            --project-directory infra/production config --quiet
          docker run --rm --network none marktat-api:ci sh -c 'pnpm --version && ls /app/node_modules/.pnpm/@prisma+engines@*/node_modules/@prisma/engines/ | grep -q openssl-3'
      - name: Skripte prüfen
        run: |
          bash -n infra/production/deploy.sh infra/production/backup.sh infra/production/setup-server.sh infra/production/probe/probe.sh
          shellcheck -S warning infra/production/*.sh infra/production/probe/probe.sh

  audit:
    name: Sicherheitslücken in Abhängigkeiten
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # Ohne Installation gibt es keinen pnpm-Store; der Cache-Schritt würde sonst den Job rot färben
          package-manager-cache: false
      # Nur Laufzeit-Abhängigkeiten; ab „high“ schlägt der Job fehl (moderate stehen im Log)
      - run: pnpm audit --prod --audit-level high

  e2e:
    name: Browser-Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Bilder im lokalen Dateisystem statt R2 – die CI hat (und braucht) keine Cloudflare-Zugangsdaten.
      STORAGE_DRIVER: local
      # E-Mails zu Nachrichten sofort, damit der Zwei-Konten-Test sie in Mailpit prüfen kann
      MESSAGE_EMAIL_DELAY_SECONDS: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Lokale Umgebung starten
        run: pnpm infra:up --wait
      - run: pnpm db:migrate
      # Demo-Inserate: die Suchtests (e2e/search.spec.ts) prüfen Filter und Umkreis daran
      - run: pnpm db:seed -- --demo
      - run: pnpm build
      - name: Suchindex aus den Demodaten aufbauen
        run: pnpm --filter @marktat/api search:reindex
      - name: Playwright-Browser installieren
        run: pnpm --filter @marktat/web exec playwright install --with-deps chromium
      - name: API und Web starten
        # Partnerangebote gegen den Awin-Testserver aus e2e/fake-awin.ts (startet affiliate.spec.ts) – keine echten Schlüssel
        env:
          AWIN_ENABLED: 'true'
          AWIN_PUBLISHER_ID: '123456'
          AWIN_API_TOKEN: e2e-api-token-0123456789
          AWIN_FEED_API_KEY: e2e-feed-key-0123456789
          AWIN_API_URL: http://127.0.0.1:4599
          AWIN_PRODUCTDATA_URL: http://127.0.0.1:4599
          OUTBOUND_ALLOW_PRIVATE: 'true'
        run: |
          (cd apps/api && nohup pnpm start > ../../api.log 2>&1 &)
          (cd apps/web && nohup pnpm start > ../../web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/v1/health \
              && curl -sf -o /dev/null http://localhost:3000/ \
              && curl -sf -o /dev/null http://localhost:54321/auth/v1/health \
              && exit 0
            sleep 2
          done
          cat api.log web.log
          exit 1
      - run: pnpm --filter @marktat/web test:e2e
        env:
          E2E_AWIN_FAKE_PORT: '4599'
      - if: failure()
        run: cat api.log web.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
