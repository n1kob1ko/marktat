# Lokaler Ersatz für das Supabase-API-Gateway (Kong).
server {
  listen 80;
  server_name _;

  # Docker-DNS erst zur Anfragezeit auflösen, damit nginx auch startet, bevor GoTrue läuft.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $gotrue http://auth:9999;

  # Supabase Auth: http://localhost:54321/auth/v1/* -> GoTrue
  location /auth/v1/ {
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $gotrue;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host:54321;
  }

  # E-Mail-Vorlagen, die GoTrue beim Versand lädt (nur im internen Docker-Netz relevant).
  location /email-templates/ {
    alias /usr/share/nginx/email-templates/;
    default_type text/html;
    charset utf-8;
  }

  location = /health {
    return 200 'ok';
  }
}
