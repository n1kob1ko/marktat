# Lokale Entwicklungsumgebung für MarktAT.
# Start: `pnpm infra:up` im Repo-Wurzelverzeichnis (liest die Werte aus ../.env).
# Alle Zugangsdaten hier sind reine Entwicklungswerte und dürfen nie produktiv verwendet werden.
name: marktat

services:
  db:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marktat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marktat_dev_pw}
      POSTGRES_DB: marktat
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/20-marktat-init.sh:/docker-entrypoint-initdb.d/20-marktat-init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-marktat} -d marktat']
      interval: 5s
      timeout: 5s
      retries: 20

  # Supabase Auth (GoTrue) – dieselbe Software wie in Supabase-Projekten, lokal ohne Cloud-Konto.
  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:54321}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER:-marktat}:${POSTGRES_PASSWORD:-marktat_dev_pw}@db:5432/marktat_auth?search_path=auth
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_SITE_URL: ${WEB_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${WEB_URL:-http://localhost:3000}/**
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${SUPABASE_PUBLIC_URL:-http://localhost:54321}/auth/v1
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_PASSWORD_MIN_LENGTH: '10'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: 'true'
      GOTRUE_MAILER_OTP_EXP: '86400'
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: '1025'
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@marktat.local
      GOTRUE_SMTP_SENDER_NAME: MarktAT
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://gateway/email-templates/confirmation.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://gateway/email-templates/recovery.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Bitte bestätige deine E-Mail-Adresse
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Passwort zurücksetzen
      # Großzügige Limits für lokale Tests; in Supabase-Projekten im Dashboard einstellen.
      GOTRUE_RATE_LIMIT_EMAIL_SENT: '1000'
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: '1000'
      GOTRUE_RATE_LIMIT_VERIFY: '1000'
      GOTRUE_RATE_LIMIT_OTP: '1000'
      GOTRUE_LOG_LEVEL: info

  # Bildet den Pfad /auth/v1 von Supabase nach, damit supabase-js lokal und in der Cloud gleich funktioniert.
  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - '${SUPABASE_GATEWAY_PORT:-54321}:80'
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./email-templates:/usr/share/nginx/email-templates:ro

  # Fängt alle E-Mails ab. Weboberfläche: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.32
    restart: unless-stopped
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'
      - '${MAILPIT_SMTP_PORT:-1025}:1025'

  # Für Hintergrundaufgaben (BullMQ) und Caching – wird ab Phase 2/3 genutzt.
  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data

  # Volltextsuche (Phase 4). Ohne Meilisearch sucht die API direkt in PostgreSQL.
  meilisearch:
    image: getmeili/meilisearch:v1.56
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-marktat_dev_meili_master_key_change_me}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '${MEILI_PORT:-7700}:7700'
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:7700/health']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
  redis-data:
  meili-data:
