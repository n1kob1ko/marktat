<!doctype html>
<html lang="de-AT">
  <body style="margin:0;padding:24px;background:#f6f4ef;font-family:Arial,Helvetica,sans-serif;color:#1c2321">
    <table role="presentation" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px">
      <tr><td>
        <p style="font-size:22px;font-weight:bold;margin:0 0 16px;color:#0f4c3a">MarktAT</p>
        <h1 style="font-size:20px;margin:0 0 12px">Willkommen bei MarktAT!</h1>
        <p style="font-size:15px;line-height:1.5;margin:0 0 20px">
          Bitte bestätige deine E-Mail-Adresse {{ .Email }}, damit du Anzeigen aufgeben und Nachrichten schreiben kannst.
        </p>
        <p style="margin:0 0 24px">
          <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/konto"
             style="display:inline-block;background:#0f4c3a;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:bold">
            E-Mail-Adresse bestätigen
          </a>
        </p>
        <p style="font-size:13px;line-height:1.5;color:#5b6461;margin:0">
          Der Link ist 24 Stunden gültig. Wenn du dich nicht bei MarktAT registriert hast, kannst du diese E-Mail ignorieren.
        </p>
      </td></tr>
    </table>
  </body>
</html>
